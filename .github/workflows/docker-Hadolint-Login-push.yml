name: Docker Push

on:
  workflow_call:

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        folders:
          - backend
          - frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: ${{ matrix.folders}} Dockerfile Lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.folders}}/Dockerfile
          # Testing only
          no-fail: true

# Before login make sure you have add the Docker Username and PAT in Github Action Secrets.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.folders }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/github-action-python-3tier-${{ matrix.folders }}:latest
