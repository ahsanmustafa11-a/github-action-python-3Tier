name: DevSecOps

on:
  push:
    branches: [main]

jobs:

  # 1. Code Quality (Flake8 + ESLint)
  Code-Linting:
    uses: ./.github/workflows/lint.yml

  # 2. Secret Scanning
  GitLeaks:
    needs: Code-Linting
    uses: ./.github/workflows/gitleaks.yml

  # 3. Static Application Security Testing
  SAST:
    needs: GitLeaks
    uses: ./.github/workflows/sast.yml

  # 4. Software Composition Analysis
  SCA:
    needs: SAST
    uses: ./.github/workflows/sca.yml

  # 5. Code Quality Analysis
  Sonar-Scan:
    needs: SCA
    uses: ./.github/workflows/sonarqube.yml
    secrets: inherit

  # 6. Build Docker Images + Hadolint + Push
  Docker-Build:
    needs: Sonar-Scan
    uses: ./.github/workflows/docker-Hadolint-Login-push.yml
    secrets: inherit

  # 7. Container Vulnerability Scan
  Trivy-Scan:
    needs: Docker-Build
    uses: ./.github/workflows/trivy-image.yml

###------- Before this all the steps are CI now Add the CD to make complete CI/CD pipeline with security.
  # 8. Deploy to Server
  Deploy-CD:
    needs: Trivy-Scan
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  # 9. Dynamic Application Security Testing
  DAST:
    needs: Deploy-CD
    uses: ./.github/workflows/dast.yml
    secrets: inherit
